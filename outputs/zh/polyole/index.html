    <header class="topbar"><div><h1>Polyole</h1><p>把正方形完整填满。</p></div><a class="top-link" href="/zh/">返回游戏选择</a></header>
    <main class="detail-layout">
      <section class="detail-hero"><div class="detail-copy"><span class="game-card-label">益智</span><h2>Polyole 益智游戏</h2><p>Polyole 是一款将不同形状的方块放入正方形棋盘的方块拼图和逻辑益智游戏。选择棋盘大小，然后拖动方块进行放置，练习空间思维。</p><a class="primary-link" href="/zh/#gameSelectPanel">玩 Polyole</a></div><img class="detail-image" src="/assets/polyole-card.png" alt="Polyole 益智游戏" /></section>
      <section class="detail-grid"><article class="info-panel"><h2>游戏目标</h2><p>目标是在没有空隙的情况下填满整个棋盘，是适合短时间游玩的空间思考游戏。</p></article><article class="info-panel"><h2>玩法</h2><p>选择棋盘大小并开始，将方块拖到棋盘上，必要时使用旋转或撤销。</p></article><article class="info-panel"><h2>技巧</h2><p>可以先放置大方块或适合角落的方块。如果出现难以填补的空隙，尽早撤销并尝试其他位置。</p></article></section>
